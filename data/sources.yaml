# Documents the RAG app answers questions about.
#
# PDFs are downloaded by scripts/download_corpus.py into data/raw/ and are not committed
# (arXiv papers are not freely redistributable; the OWASP PDF is large).
# Markdown files are this repo's own research notes.
#
# Each URL points at one fixed version (an arXiv version number, a git commit), and
# sha256 is the hash of that exact file. The downloader refuses anything else, so the
# index is always built from the same text the published results came from.

