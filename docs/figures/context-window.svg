<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="title desc">
<title id="title">What the model sees in one request</title>
<desc id="desc">The context window of one request holds a system prompt, few-shot examples, a document and the user question. All of it goes into a language model whose weights are frozen, which produces the answer. When the request ends the window is cleared and nothing is stored in the model.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#0b0b0b;--hair:#c3c2b7;--grid:#e1e0d9;--gray:#ecebe7;--bar:#b9b8b2;--accent:#2a78d6;--accent-wash:#e3eefb}
@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--line:#d6d5d0;--hair:#4a4a45;--grid:#2c2c2a;--gray:#2a2a28;--bar:#5c5b57;--accent:#3987e5;--accent-wash:#17293f}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.bg{fill:var(--surface)}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.panel{fill:var(--gray)}
.gray{fill:var(--gray);stroke:var(--line);stroke-width:1.2}
.accent{fill:var(--accent-wash);stroke:var(--accent);stroke-width:1.5}
.rim{fill:none;stroke:var(--accent);stroke-width:1.5}
.solid{fill:var(--accent)}
.bar{fill:var(--bar)}
.dot{fill:var(--ink)}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--hair);stroke-width:1;fill:none}
.arrow{stroke:var(--ink2);stroke-width:1.6;fill:none}
.head{fill:var(--ink2)}
.lock{fill:none;stroke:var(--ink2);stroke-width:1.6}
.lockbody{fill:var(--ink2)}
.h{font-size:15px;font-weight:600}
.lane{font-size:14px;font-weight:600}
.lane-s{font-size:12px;font-weight:400;fill:var(--ink2)}
.b{font-size:13px;font-weight:600}
.t{font-size:13px}
.s{font-size:12px;fill:var(--ink2)}
.m{font-size:11px;fill:var(--muted)}
.op{font-size:26px;fill:var(--ink2)}
.big{font-size:30px;font-weight:600}
.model{font-size:18px;font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="820" height="300" rx="12"/>

<text class="b" x="20" y="28">Context window of one request</text>
<rect class="panel" x="20" y="40" width="320" height="220" rx="8"/>

<rect class="box" x="32" y="52" width="296" height="44" rx="6"/>
<text class="b" x="44" y="70">System prompt</text>
<text class="s" x="44" y="87">Answer only using the policy below.</text>

<rect class="box" x="32" y="104" width="296" height="44" rx="6"/>
<text class="b" x="44" y="122">Examples (few-shot)</text>
<text class="s" x="44" y="139">Q: Can I exchange a bulb? A: Yes, within 30 days.</text>

<rect class="accent" x="32" y="156" width="296" height="44" rx="6"/>
<text class="b" x="44" y="174">Document</text>
<text class="s" x="44" y="191">&lt;policy&gt; Returns are accepted within 30 days...</text>

<rect class="box" x="32" y="208" width="296" height="44" rx="6"/>
<text class="b" x="44" y="226">User question</text>
<text class="s" x="44" y="243">Can I return a lamp I bought 45 days ago?</text>

<line class="arrow" x1="346" y1="156" x2="404" y2="156" marker-end="url(#ah)"/>

<rect class="gray" x="410" y="106" width="170" height="100" rx="8"/>
<text class="model" x="495" y="142" text-anchor="middle">LLM</text>
<text class="s" x="495" y="164" text-anchor="middle">weights frozen</text>
<path class="lock" d="M492,184 v-3 a3,3 0 0 1 6,0 v3"/>
<rect class="lockbody" x="489" y="184" width="12" height="9" rx="2"/>

<line class="arrow" x1="586" y1="156" x2="644" y2="156" marker-end="url(#ah)"/>

<text class="s" x="650" y="108">Answer</text>
<rect class="box" x="650" y="116" width="150" height="80" rx="8"/>
<text class="t" x="664" y="144">No. Returns are</text>
<text class="t" x="664" y="161">accepted within</text>
<text class="t" x="664" y="178">30 days.</text>

<text class="s" x="20" y="286">When the request ends the window is cleared. Nothing is stored in the model.</text>
</svg>
