<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" role="img" aria-labelledby="title desc">
<title id="title">Refusal gate on the evaluation questions</title>
<desc id="desc">Each evaluation question plotted by its best meaning score and best keyword score. The gate accepts a question when meaning is at least 0.645 or keywords at least 0.7. Answerable questions fall in the accepted area; short acronym questions are rescued by the keyword score; off-topic questions fall outside, except one whose words appear in the documents themselves.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#0b0b0b;--hair:#c3c2b7;--grid:#e1e0d9;--gray:#ecebe7;--bar:#b9b8b2;--accent:#2a78d6;--accent-wash:#e3eefb}
@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--line:#d6d5d0;--hair:#4a4a45;--grid:#2c2c2a;--gray:#2a2a28;--bar:#5c5b57;--accent:#3987e5;--accent-wash:#17293f}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.bg{fill:var(--surface)}
.zone{fill:var(--accent-wash)}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--hair);stroke-width:1;fill:none}
.thr{stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4}
.ans{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.oos{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.una{fill:var(--bar);stroke:var(--surface);stroke-width:1.5}
.lead{stroke:var(--ink2);stroke-width:1}
.h{font-size:15px;font-weight:600}
.s{font-size:12px;fill:var(--ink2)}
.m{font-size:11px;fill:var(--muted)}
</style>
<rect class="bg" width="860" height="500" rx="12"/>
<text class="h" x="24" y="32">What the gate sees</text>
<text class="s" x="24" y="52">Each dot is one evaluation question. Shaded: answered (meaning ≥ 0.645 or keywords ≥ 0.7).</text>
<rect class="zone" x="368.9" y="110" width="311.1" height="320"/>
<rect class="zone" x="70" y="110" width="298.9" height="96.0"/>
<line class="grid" x1="192.0" y1="110" x2="192.0" y2="430"/>
<text class="m" x="192.0" y="448" text-anchor="middle">0.5</text>
<line class="grid" x1="314.0" y1="110" x2="314.0" y2="430"/>
<text class="m" x="314.0" y="448" text-anchor="middle">0.6</text>
<line class="grid" x1="436.0" y1="110" x2="436.0" y2="430"/>
<text class="m" x="436.0" y="448" text-anchor="middle">0.7</text>
<line class="grid" x1="558.0" y1="110" x2="558.0" y2="430"/>
<text class="m" x="558.0" y="448" text-anchor="middle">0.8</text>
<line class="grid" x1="680.0" y1="110" x2="680.0" y2="430"/>
<text class="m" x="680.0" y="448" text-anchor="middle">0.9</text>
<line class="grid" x1="70" y1="350.0" x2="680" y2="350.0"/>
<text class="m" x="62" y="354.0" text-anchor="end">0.25</text>
<line class="grid" x1="70" y1="270.0" x2="680" y2="270.0"/>
<text class="m" x="62" y="274.0" text-anchor="end">0.50</text>
<line class="grid" x1="70" y1="190.0" x2="680" y2="190.0"/>
<text class="m" x="62" y="194.0" text-anchor="end">0.75</text>
<line class="grid" x1="70" y1="110.0" x2="680" y2="110.0"/>
<text class="m" x="62" y="114.0" text-anchor="end">1.00</text>
<text class="m" x="62" y="434" text-anchor="end">0</text>
<path class="axis" d="M70,110 V430 H680"/>
<line class="thr" x1="368.9" y1="110" x2="368.9" y2="430"/>
<line class="thr" x1="70" y1="206.0" x2="368.9" y2="206.0"/>
<text class="s" x="375.0" y="470" text-anchor="middle">best meaning score (cosine similarity)</text>
<text class="s" x="18" y="270.0" text-anchor="middle" transform="rotate(-90 18 270.0)">best keyword score (BM25)</text>
