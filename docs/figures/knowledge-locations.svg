<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="title desc">
<title id="title">Where knowledge lives</title>
<desc id="desc">Three places knowledge can live. In the weights: pre-training, continued pre-training, fine-tuning and distillation, updated by training again. In the context window: prompting, updated by editing the prompt. In an external store: RAG and memory, updated by editing the database, and copied into the context window when needed. The first changes what the model is, the other two change what the model sees.</desc>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#0b0b0b;--hair:#c3c2b7;--grid:#e1e0d9;--gray:#ecebe7;--bar:#b9b8b2;--accent:#2a78d6;--accent-wash:#e3eefb}
@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--line:#d6d5d0;--hair:#4a4a45;--grid:#2c2c2a;--gray:#2a2a28;--bar:#5c5b57;--accent:#3987e5;--accent-wash:#17293f}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.bg{fill:var(--surface)}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.panel{fill:var(--gray)}
.gray{fill:var(--gray);stroke:var(--line);stroke-width:1.2}
.accent{fill:var(--accent-wash);stroke:var(--accent);stroke-width:1.5}
.rim{fill:none;stroke:var(--accent);stroke-width:1.5}
.solid{fill:var(--accent)}
.bar{fill:var(--bar)}
.dot{fill:var(--ink)}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--hair);stroke-width:1;fill:none}
.arrow{stroke:var(--ink2);stroke-width:1.6;fill:none}
.head{fill:var(--ink2)}
.lock{fill:none;stroke:var(--ink2);stroke-width:1.6}
.lockbody{fill:var(--ink2)}
.h{font-size:15px;font-weight:600}
.lane{font-size:14px;font-weight:600}
.lane-s{font-size:12px;font-weight:400;fill:var(--ink2)}
.b{font-size:13px;font-weight:600}
.t{font-size:13px}
.s{font-size:12px;fill:var(--ink2)}
.m{font-size:11px;fill:var(--muted)}
.op{font-size:26px;fill:var(--ink2)}
.big{font-size:30px;font-weight:600}
.model{font-size:18px;font-weight:600}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="820" height="300" rx="12"/>

<!-- Card 1: weights -->
<rect class="box" x="20" y="20" width="210" height="220" rx="8"/>
<text class="h" x="36" y="48">In the weights</text>
<text class="s" x="36" y="68">parametric</text>
<circle class="dot" cx="40" cy="100" r="3.5"/><text class="t" x="52" y="104">Pre-training</text>
<circle class="dot" cx="40" cy="126" r="3.5"/><text class="t" x="52" y="130">Continued pre-training</text>
<circle class="dot" cx="40" cy="152" r="3.5"/><text class="t" x="52" y="156">Fine-tuning</text>
<circle class="dot" cx="40" cy="178" r="3.5"/><text class="t" x="52" y="182">Distillation</text>
<text class="s" x="36" y="222">Update: train again</text>

<!-- Card 2: context window -->
<rect class="box" x="305" y="20" width="210" height="220" rx="8"/>
<text class="h" x="321" y="48">In the context window</text>
<text class="s" x="321" y="68">temporary, one request</text>
<circle class="dot" cx="325" cy="100" r="3.5"/><text class="t" x="337" y="104">Prompting</text>
<text class="s" x="321" y="222">Update: edit the prompt</text>

<!-- Card 3: external store -->
<rect class="box" x="590" y="20" width="210" height="220" rx="8"/>
<text class="h" x="606" y="48">In an external store</text>
<text class="s" x="606" y="68">non-parametric</text>
<circle class="dot" cx="610" cy="100" r="3.5"/><text class="t" x="622" y="104">RAG (documents)</text>
<circle class="dot" cx="610" cy="126" r="3.5"/><text class="t" x="622" y="130">Memory (past chats)</text>
<text class="s" x="606" y="222">Update: edit the database</text>

<!-- Store is copied into the context -->
<line class="arrow" x1="586" y1="140" x2="520" y2="140" marker-end="url(#ah)"/>
<text class="m" x="552" y="128" text-anchor="middle">copied in</text>
<text class="m" x="552" y="160" text-anchor="middle">when needed</text>

<!-- Brackets -->
<path class="axis" d="M20,254 v6 h210 v-6"/>
<text class="s" x="125" y="282" text-anchor="middle">changes what the model is</text>
<path class="axis" d="M305,254 v6 h495 v-6"/>
<text class="s" x="552" y="282" text-anchor="middle">changes what the model sees</text>
</svg>
